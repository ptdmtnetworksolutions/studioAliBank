# Settings to manage and configure a Firebase App Hosting backend.
# https://firebase.google.com/docs/app-hosting/configure

runConfig:
  # Optimal configuration for Next.js 15 SSR
  maxInstances: 5
  minInstances: 0
  cpu: 1
  memoryMiB: 1024

# Node.js 20 environment for modern Next.js 15 support
runtime: nodejs20

env:
  - variable: NODE_ENV
    value: production
